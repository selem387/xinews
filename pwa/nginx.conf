server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=300"; }
  location ~* \.(png|svg|webmanifest)$ { add_header Cache-Control "public, max-age=86400"; }
  location / { try_files $uri $uri/ /index.html; }
}
